<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>

    <h1>Login</h1>

    <div class="card">

        <p id="errorBox" class="errorBox"></p>

        <input id="username" type="text" placeholder="Username">
        <br><br>

        <input id="password" type="password" placeholder="Password">
        <br><br>

        <button onclick="login()">Login</button>

        <p>
            No account?
            <a href="signup.html">Click here</a>
        </p>

    </div>

<script>

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyC7DBA3XUEkFbbtxVrhg6yvD8IKjWqUzQc",
  authDomain: "computing-feedback-chat.firebaseapp.com",
  projectId: "computing-feedback-chat",
  storageBucket: "computing-feedback-chat.firebasestorage.app",
  messagingSenderId: "873968911336",
  appId: "1:873968911336:web:489ac7214624a5412fda5d",
  measurementId: "G-H4DW9K62VQ"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

/* Error Box */
function showError(msg){

    let box = document.getElementById("errorBox");

    box.textContent = msg;
    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 3000);

}

function clearError(){
    document.getElementById("errorBox").style.display = "none";
}

/* Username → Email */
function makeEmail(username){

    return username
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ".")
        + "@app.com";
}

/* Login */
function login(){

    clearError();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username.trim() === "" || password.trim() === ""){
        showError("Please fill in all fields");
        return;
    }

    let email = makeEmail(username);

    firebase.auth()
    .signInWithEmailAndPassword(email, password)
    .then(() => {

        window.location = "home.html";

    })
    .catch(err => {

        let msg = "";

        if(err.code === "auth/user-not-found"){
            msg = "Username not found";
        }
        else if(err.code === "auth/wrong-password"){
            msg = "Incorrect password";
        }
        else if(err.code === "auth/invalid-email"){
            msg = "Invalid username";
        }
        else{
            msg = "Login failed";
        }

        showError(msg);

    });

}

/* Enter Key Support */
document.getElementById("password")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
